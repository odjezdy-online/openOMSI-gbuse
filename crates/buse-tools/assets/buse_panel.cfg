# buse_panel.cfg - vnitřní LED panel BUSE BS120 / BS190
# Formát: klíč = hodnota; komentář začíná # nebo ;
# Čte ho DLL plugin (OMSI 2, openOMSI) i gbuse-convert. Lua plugin má stejné klíče v config.lua.
# Řádky označené HYPOTÉZA odpovídají neověřeným částem formátu gBUSE1 (PROMPT.md, oddíl 2).

# ---------------------------------------------------------------- databáze
database = ADledA.hex          # .hex z gBUSE1 nebo buse_db.bin, ve složce pluginu
zst_map = zst_map.csv          # omsi_name;zst_id (generuje gbuse-convert --hof)

# ---------------------------------------------------------------- panel
width = auto                   # auto = z hlavičky databáze (Brno: 135 = BS 120.0A, 8 x 135 bodů); nebo číslo
rows = 1                       # 1 = jednořádek BS 120 (8 řádků), 2 = dvouřádek BS 120.0K (16 řádků, v PID 16 x 136)
align = auto                   # auto = podle pole cyklu (HYPOTÉZA: režim 03 na střed, 00 vlevo) | left | center

# běžící text (když je stránka širší než panel)
scroll_step_ms = 50            # 1 sloupec za 50 ms
scroll_gap = 16                # mezera mezi opakováními
scroll_start_delay_ms = 0
scroll_full_pass = true        # stránka skončí nejdřív po jednom celém průběhu

# nasouvání zespodu při změně stránky
slide = push                   # push | none
slide_steps = 8
slide_step_ms = 40

# ---------------------------------------------------------------- zástupný znak & a piktogramy
# & stojí na začátku každé zastávky, ale žádný font databáze ho nemá: nekreslí se. C0 je
# podle vnějších panelů (gBUSE0: C0 = horní řádek, CA = o 10 řádků níž) svislý posun, ne
# příznak zastávky na znamení. Symbol za & jde zapnout: symbol:E1:F1 + placeholder_flag.
placeholder = hide             # hide | glyph | blank:N | symbol:FONT:GLYF | dop:N
placeholder_flag = none        # & se kreslí jen u záznamů s tímto příznakem (např. C0); none = u všech
placeholder_else = hide        # co s & u ostatních záznamů
placeholder_dest = hide        # & na stránce „cíl"
missing_glyph = fallback       # fallback (glyf z E1, jinak rámeček) | box | skip
# HYPOTÉZA 2.4: fonty E5-E9 v databázi nejsou; glyf F8 v nich = piktogram z E1.
# none = neznámý font se vykreslí fontem E1 (u všech čtyř pak vyjde F8 = paroží).
pict_alias = E5:F8=E1:F8, E7:F8=E1:F9, E8:F8=E1:F6, E9:F8=E1:F7

# ---------------------------------------------------------------- cykly
# Stránky se berou z tabulky CYK: položka = pole (šířka, šablona, proměnná, režim, doba).
# Pole stojí vedle sebe, dokud se vejdou do šířky panelu: linka (22) + cíl (112), zóna (67) +
# čas (67); zastávka a mim. informace mají celou šířku. false = záložní cyklus níže.
use_cyk = true
cycle_idle = 0, 2              # klidový cyklus: linka, cíl, mim. inf. + zóna, čas
cycle_stop = 6                 # po změně zastávky / stisku STOP: zastávka, mim. inf.
cyk_time_unit_ms = 1000        # pole „doba" stránky v sekundách
cyk_effect_slides = true       # režim 0 = bez nasouvání
var_map = 01=line, 08=stop, 09=dest, 0A=info, 0D=time, 0E=zone
hold_ms = 4000                 # stránka s dobou 0 („do odvolání") v cyklu

# záložní cyklus (use_cyk = false, nebo když CYK chybí): proměnná:sekundy[@DOP]
fallback_pages = line:4, dest:4, time:4
fallback_stop_pages = stop:6
row2_pages = stop:4            # spodní řádek dvouřádku (horní je klidový cyklus: linka + cíl, zóna + čas)
linedest_gap = 4

stop_on_change = true          # stránka „zastávka" při změně příští zastávky
stop_on_press = true           # … a po stisku STOP (drží, dokud STOP svítí)

# ---------------------------------------------------------------- napojení na vůz
# str:JMENO = string proměnná, num:JMENO[/DĚLITEL] = číselná; none = nepoužít.
# Výchozí hodnoty odpovídají vozu SOR_NB12 (IBIS-2.osc + VMatrix.osc).
in_line = str:Matrix_Nr
in_dest_name = str:IBIS_terminus_name
in_dest_code = none            # číselný kód cíle, který je přímo ZST id
in_stop_name = str:IBIS_busstop_name
in_stop_code = none
in_stop_pressed = num:haltewunsch
in_request = none              # 1 = příští zastávka je na znamení (jinak rozhoduje C0)
in_zone = none
in_info = none
in_power = num:elec_busbar_main
zone_text =                    # pevný text zóny / mimořádné informace
info_text =
fix_encoding = auto            # oprava textů čtených jako Windows-1252 místo 1250

# výstup (jména musí sedět se skriptem vozu, generuje je gbuse-convert)
out_frame = BSLED_frame
out_prefix = BSLED_r
